<!doctype html>
<html lang=en>
<head>
  <meta charset=utf-8>
  <meta name=viewport content=width=device-width, initial-scale=1>
  <title>Rudra AI</title>
  <link rel=preconnect href=https://fonts.googleapis.com>
  <link href=https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap rel=stylesheet>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #060a10;
      --surface: rgba(14, 22, 36, 0.82);
      --border: rgba(100, 200, 255, 0.12);
      --text: #d4eeff;
      --muted: rgba(140, 200, 240, 0.55);
      --c-idle: #3b7fc4;
      --c-listening: #00d4ff;
      --c-thinking: #f59e0b;
      --c-speaking: #22c55e;
    }
    body {
      min-height: 100vh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: var(--bg);
      font-family: 'Outfit', system-ui, sans-serif;
      color: var(--text);
      overflow: hidden;
      padding: 20px;
    }
    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse 80% 60% at 50% 0%, rgba(0,100,200,0.08) 0%, transparent 70%),
                  radial-gradient(ellipse 50% 40% at 80% 100%, rgba(0,200,150,0.05) 0%, transparent 70%);
    }
    .wordmark { letter-spacing: 0.35em; font-size: 13px; font-weight: 500; text-transform: uppercase; color: var(--muted); margin-bottom: 28px; }
    .orb-wrap { position: relative; width: 200px; height: 200px; margin-bottom: 24px; }
    .orb {
      width: 100%; height: 100%; border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, rgba(60,160,255,0.35), rgba(10,40,90,0.15) 55%, transparent 72%);
      border: 1.5px solid rgba(80,180,255,0.2);
      box-shadow: 0 0 40px rgba(30,140,255,0.2), inset 0 0 35px rgba(50,180,255,0.12);
      transition: background 0.6s, border-color 0.6s, box-shadow 0.6s;
      animation: idle-pulse 4s ease-in-out infinite;
    }
    .orb::after { content: ''; position: absolute; inset: 18px; border-radius: 50%; border: 1px solid rgba(80,200,255,0.15); animation: idle-pulse 4s ease-in-out infinite reverse; }
    body.listening .orb {
      background: radial-gradient(circle at 35% 35%, rgba(0,220,255,0.45), rgba(0,80,160,0.12) 55%, transparent 72%);
      border-color: rgba(0,220,255,0.4);
      box-shadow: 0 0 60px rgba(0,210,255,0.35), inset 0 0 40px rgba(0,230,255,0.18);
      animation: listen-pulse 1.1s ease-in-out infinite;
    }
    body.thinking .orb {
      background: radial-gradient(circle at 35% 35%, rgba(245,158,11,0.4), rgba(120,60,0,0.12) 55%, transparent 72%);
      border-color: rgba(245,158,11,0.45);
      box-shadow: 0 0 55px rgba(245,158,11,0.3), inset 0 0 35px rgba(250,180,20,0.15);
      animation: think-spin 1.4s linear infinite;
    }
    body.speaking .orb {
      background: radial-gradient(circle at 35% 35%, rgba(34,197,94,0.42), rgba(0,80,30,0.1) 55%, transparent 72%);
      border-color: rgba(34,197,94,0.45);
      box-shadow: 0 0 60px rgba(34,197,94,0.32), inset 0 0 40px rgba(50,220,100,0.15);
      animation: speak-pulse 0.68s ease-in-out infinite;
    }
    @keyframes idle-pulse   { 0%,100%{transform:scale(0.95);opacity:0.75;} 50%{transform:scale(1);opacity:1;} }
    @keyframes listen-pulse { 0%,100%{transform:scale(0.97);} 50%{transform:scale(1.06);} }
    @keyframes think-spin   { to{transform:rotate(360deg) scale(1.03);} }
    @keyframes speak-pulse  { 0%,100%{transform:scale(0.97);} 50%{transform:scale(1.09);} }
    .state-badge { font-size:11px; font-weight:600; letter-spacing:0.3em; text-transform:uppercase; color:var(--muted); margin-bottom:24px; height:18px; transition:color 0.4s; }
    body.listening .state-badge { color: var(--c-listening); }
    body.thinking  .state-badge { color: var(--c-thinking); }
    body.speaking  .state-badge { color: var(--c-speaking); }
    .panels { width: 100%; display: flex; flex-direction: column; gap: 10px; }
    .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; backdrop-filter: blur(12px); transition: border-color 0.4s, box-shadow 0.4s; }
    body.listening .user-panel  { border-color: rgba(0,220,255,0.25); box-shadow: 0 0 18px rgba(0,210,255,0.08); }
    body.speaking  .rudra-panel { border-color: rgba(34,197,94,0.25); box-shadow: 0 0 18px rgba(34,197,94,0.08); }
    .panel-label { font-size:10px; font-weight:600; letter-spacing:0.2em; text-transform:uppercase; color:var(--muted); margin-bottom:6px; }
    .panel-text { font-size:14px; line-height:1.5; min-height:42px; color:var(--text); word-break:break-word; }
    body.listening .user-panel .panel-text::after { content:'|'; animation:blink 1s step-start infinite; opacity:0.6; margin-left:2px; }
    @keyframes blink { 50%{opacity:0;} }
    .status-row { display:flex; align-items:center; gap:7px; margin-top:22px; font-size:11px; color:var(--muted); }
    .dot { width:7px; height:7px; border-radius:50%; background:#3b7fc4; transition:background 0.4s; }
    body.listening .dot { background:var(--c-listening); animation:dot-blink 1s ease infinite; }
    body.thinking  .dot { background:var(--c-thinking);  animation:dot-blink 0.7s ease infinite; }
    body.speaking  .dot { background:var(--c-speaking);  animation:dot-blink 0.6s ease infinite; }
    @keyframes dot-blink { 0%,100%{opacity:1;} 50%{opacity:0.3;} }
  </style>
</head>
<body id=body>
  <p class=wordmark>R U D R A &nbsp; A I</p>
  <div class=orb-wrap aria-label=Rudra activity orb><div class=orb></div></div>
  <p class=state-badge id=state-badge>idle</p>
  <div class=panels>
    <div class=panel user-panel>
      <p class=panel-label>You said</p>
      <p class=panel-text id=user_text>Waiting for your voice&#8230;</p>
    </div>
    <div class=panel rudra-panel>
      <p class=panel-label>Rudra</p>
      <p class=panel-text id=response_text>Ready when you are.</p>
    </div>
  </div>
  <div class=status-row><span class=dot></span><span id=status-text>Listening for wake word</span></div>
  <script>
    const body_el   = document.getElementById('body');
    const badge     = document.getElementById('state-badge');
    const userText  = document.getElementById('user_text');
    const respText  = document.getElementById('response_text');
    const statusTxt = document.getElementById('status-text');
    const LABELS = { idle:'idle', listening:'listening', thinking:'thinking...', speaking:'speaking' };
    const STATUS = {
      idle:'Listening for wake word',
      listening:'Hearing you - speak your command',
      thinking:'Processing your request',
      speaking:'Responding'
    };
    window.setState = function(state) {
      ['idle','listening','thinking','speaking'].forEach(s => body_el.classList.remove(s));
      if (state) body_el.classList.add(state);
      badge.textContent     = LABELS[state] || state;
      statusTxt.textContent = STATUS[state]  || state;
    };
    window.setTranscript = function(user, response) {
      userText.textContent = user     || 'Waiting for your voice...';
      respText.textContent = response || 'Ready when you are.';
    };
  </script>
</body>
</html>
