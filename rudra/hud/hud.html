<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rudra HUD</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      color: #dffcff;
      background: #050b12;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    .hud { width: 420px; padding: 24px; }
    .ring {
      width: 180px;
      height: 180px;
      margin: 0 auto 24px;
      border-radius: 50%;
      border: 4px solid rgba(94, 234, 255, 0.25);
      background: radial-gradient(circle, rgba(27, 170, 255, 0.28), rgba(4, 28, 52, 0.08) 62%, transparent 66%);
      box-shadow: 0 0 24px rgba(28, 190, 255, 0.42), inset 0 0 30px rgba(40, 220, 255, 0.18);
      animation: idle 4s ease-in-out infinite;
    }
    .ring.listening { animation: listening 1.2s ease-in-out infinite; }
    .ring.thinking { animation: thinking 0.65s linear infinite; }
    .ring.speaking { animation: speaking 0.72s ease-in-out infinite; }
    .panel {
      margin-top: 12px;
      padding: 12px;
      border: 1px solid rgba(110, 222, 255, 0.22);
      border-radius: 12px;
      background: rgba(9, 24, 38, 0.86);
    }
    label { display: block; font-size: 12px; color: #75d9e8; margin-bottom: 4px; }
    p { margin: 0; min-height: 44px; line-height: 1.4; }
    @keyframes idle { 0%, 100% { transform: scale(0.96); filter: brightness(0.8); } 50% { transform: scale(1); filter: brightness(1); } }
    @keyframes listening { 0%, 100% { transform: scale(0.98); filter: brightness(0.9); } 50% { transform: scale(1.04); filter: brightness(1.35); } }
    @keyframes thinking { to { transform: rotate(360deg) scale(1.03); filter: brightness(1.2); } }
    @keyframes speaking { 0%, 100% { transform: scale(0.98); filter: brightness(1); } 50% { transform: scale(1.08); filter: brightness(1.65); } }
  </style>
</head>
<body>
  <main class="hud">
    <div id="ring" class="ring" aria-label="Rudra activity"></div>
    <div class="panel">
      <label>User said</label>
      <p id="user_text">Waiting for Rudra…</p>
    </div>
    <div class="panel">
      <label>Rudra</label>
      <p id="response_text">Ready when you are.</p>
    </div>
  </main>
  <script>
    const ring = document.getElementById('ring');
    const userText = document.getElementById('user_text');
    const responseText = document.getElementById('response_text');
    window.setState = function(state) {
      ring.className = 'ring ' + state;
    };
    window.setTranscript = function(user, response) {
      userText.textContent = user || '…';
      responseText.textContent = response || '…';
    };
  </script>
</body>
</html>
